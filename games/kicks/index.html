<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Kicks</title>
    <style>
      html,
      body,
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #04060e;
      }
    </style>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div id="app">
      <div id="game-wrap">
        <canvas id="game" width="600" height="600" tabindex="0"></canvas>
        <div id="hud"></div>
        <div id="touch-pad" aria-label="On-screen controls">
          <div class="pad-draw">
            <button type="button" id="pad-slow" data-key="slow">SLOW</button>
            <button type="button" id="pad-fast" data-key="fast">FAST</button>
          </div>
          <div class="pad-dirs">
            <button type="button" class="pad-btn" id="pad-up" data-dir="up">▲</button>
            <div class="pad-mid">
              <button type="button" class="pad-btn" id="pad-left" data-dir="left">◀</button>
              <button type="button" class="pad-btn" id="pad-down" data-dir="down">▼</button>
              <button type="button" class="pad-btn" id="pad-right" data-dir="right">▶</button>
            </div>
          </div>
        </div>
        <div id="overlay">
          <div>
            <h1 id="overlay-title">KICKS</h1>
            <p id="instructions">
              Click the game once for keyboard focus (or use the on-screen pad).
              Arrows/WASD move. Hold Z=slow draw (2×), X=fast draw. Close a
              loop on the border — the side without the Qix fills.
            </p>
            <p id="player-line">Player: …</p>
            <div id="start-scores" class="start-scores">
              <p id="personal-score">Your top score: —</p>
              <p id="high-score">High score: —</p>
            </div>
            <div id="scores-unavailable" class="hidden"></div>
            <div id="game-messages"></div>
            <p id="end-hint"></p>
            <div class="overlay-actions">
              <button id="btn-start" type="button">START</button>
              <button id="btn-leaderboard" type="button" class="hidden">LEADERBOARD</button>
              <button id="btn-next" type="button" class="hidden">NEXT LEVEL</button>
            </div>
          </div>
        </div>
        <button id="btn-quit" type="button" class="hidden" title="Quit game (Esc)">QUIT</button>
      </div>
    </div>
    <div id="leaderboard-modal" class="modal hidden" role="dialog" aria-labelledby="leaderboard-title" aria-modal="true">
      <div class="modal-panel">
        <h2 id="leaderboard-title">LEADERBOARD</h2>
        <ol id="leaderboard"></ol>
        <button id="btn-modal-close" type="button">CLOSE</button>
      </div>
    </div>
    <script src="../../shared/sl-api.js?v=19"></script>
    <script src="game.js?v=4"></script>
  </body>
</html>
