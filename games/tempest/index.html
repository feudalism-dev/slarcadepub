<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Tempest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #020008;
      }
      #game {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: block;
      }
    </style>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div id="app">
      <div id="game-wrap">
        <canvas id="game" width="768" height="768"></canvas>
        <div id="hud"></div>
        <div id="overlay">
          <div>
            <h1 id="overlay-title">TEMPEST</h1>
            <p id="instructions">
              Hold ←/→ or A/D to move (left = clockwise, right = counterclockwise).
              Space or click to fire. Press Z for Superzapper.
              Clear the tube — difficulty rises each level.
            </p>
            <p id="player-line">Player: …</p>
            <div id="start-scores" class="start-scores">
              <p id="personal-score">Your top score: —</p>
              <p id="high-score">High score: —</p>
            </div>
            <div id="scores-unavailable" class="hidden"></div>
            <div id="game-messages"></div>
            <p id="end-hint"></p>
            <div class="overlay-actions">
              <button id="btn-start" type="button">START</button>
              <button id="btn-leaderboard" type="button" class="hidden">LEADERBOARD</button>
              <button id="btn-next" type="button" class="hidden">NEXT LEVEL</button>
            </div>
          </div>
        </div>
        <button id="btn-quit" type="button" class="hidden" title="Quit game (Esc)">QUIT</button>
      </div>
    </div>
    <div id="leaderboard-modal" class="modal hidden" role="dialog" aria-labelledby="leaderboard-title" aria-modal="true">
      <div class="modal-panel">
        <h2 id="leaderboard-title">LEADERBOARD</h2>
        <ol id="leaderboard"></ol>
        <button id="btn-modal-close" type="button">CLOSE</button>
      </div>
    </div>
    <script src="../../shared/sl-api.js?v=22"></script>
    <script src="game.js?v=2"></script>
  </body>
</html>
